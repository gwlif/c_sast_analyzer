name: SAST Scan & CI Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies (libclang)
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest clang

    - name: Run PyTest Unit Tests
      run: |
        pytest tests/

    - name: Run SAST Scan on Sample Code
      run: |
        python src/analyzer.py samples/ --config config/rules.json --format html --out sample_report
